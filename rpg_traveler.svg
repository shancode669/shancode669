  <rect x="242" y="77" width="196" height="4" fill="#00c896"/>
  <text x="340" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#ffe066" font-weight="700">* THANK YOU FOR VISITING *</text>
  <text x="340" y="116" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaaff">Your presence has been noted, traveler.</text>
  <rect x="242" y="124" width="196" height="1" fill="#00c896" opacity="0.4"/>
  <text x="340" y="136" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888888">[ safe travels on your journey ]</text>
