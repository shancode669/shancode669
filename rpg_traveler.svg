<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>RPG pixel art traveler thank you banner</title>
  <desc>A pixel art RPG scene with a traveler and thank you message for GitHub profile visitors</desc>
  <defs>
    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.7} }
      @keyframes blink { 0%,90%,100%{opacity:1} 95%{opacity:0} }
      .traveler { animation: float 3s ease-in-out infinite; }
      .flame { animation: flicker 0.6s ease-in-out infinite; }
      .stars { animation: blink 4s ease-in-out infinite; }
      .stars2 { animation: blink 4s 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="680" height="220" fill="#0d0d1a"/>
  <rect x="0" y="80" width="680" height="8" fill="#1a1a2e"/>
  <rect x="60" y="30" width="3" height="3" fill="#ffe066" class="stars"/>
  <rect x="120" y="15" width="3" height="3" fill="#ffe066" class="stars2"/>
  <rect x="200" y="40" width="3" height="3" fill="#ffe066" class="stars"/>
