  <rect x="580" y="12" width="2" height="2" fill="#aaaaff" class="stars"/>
  <rect x="0" y="140" width="680" height="80" fill="#1a3a1a"/>
  <rect x="0" y="135" width="680" height="10" fill="#2a4a2a"/>
  <rect x="50" y="100" width="30" height="40" fill="#2d4a2d"/>
