  <rect x="342" y="140" width="8" height="8" fill="#8b5a2a"/>
  <rect x="354" y="140" width="8" height="8" fill="#8b5a2a"/>
  <rect x="322" y="132" width="6" height="8" fill="#ff6600" class="flame"/>
