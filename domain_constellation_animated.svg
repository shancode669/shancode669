<svg width="680" height="340" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Domain constellation map - Shanthan</title>
  <desc>Knowledge domain map showing Cybersecurity, Full Stack, Networking, Linux, AI/ML, Web Dev</desc>

<style>
.corePulse { animation: pulse 2.8s ease-in-out infinite; }
.nodePulse { animation: pulseSmall 3.8s ease-in-out infinite; }

@keyframes pulse {
  0%,100% { opacity:0.8; }
  50% { opacity:1; }
}

@keyframes pulseSmall {
  0%,100% { opacity:0.75; }
  50% { opacity:1; }
}
</style>


