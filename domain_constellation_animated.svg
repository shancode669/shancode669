  <circle cx="175" cy="255" r="4"  fill="#ffcc00" opacity="0.9"/>
  <text x="175" y="232" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="#ffcc00" opacity="0.9" letter-spacing="1" font-weight="bold">LINUX</text>
