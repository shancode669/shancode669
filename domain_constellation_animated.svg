  <text x="340" y="319" text-anchor="middle" font-family="Courier New,monospace" font-size="7" fill="#ff00aa" opacity="0.45">// FRONTEND+BACK</text>

  <text x="340" y="12" text-anchor="middle" font-family="Courier New,monospace" font-size="8" fill="#ffffff" opacity="0.12" letter-spacing="4">[ DOMAIN MAP // SHANTHAN ]</text>
